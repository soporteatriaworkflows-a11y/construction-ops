# Supabase — configuración local mínima (Paso 0 / orchestrator).
# Sin secretos. Los puertos son los estándar del stack local de Supabase.
# agent-db-rls puede extender [db], [auth] y políticas según el esquema.

project_id = "construction-ops"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

# Seeds sanitizados aplicados por `supabase db reset` (orden explícito).
# Sin datos privados. La org B y el usuario sin membresía se siembran en 0004
# (microfase auth 4A.1); el harness RLS runtime reutiliza esos UUIDs.
[db.seed]
enabled = true
sql_paths = [
  "./seeds/0001_demo_org_and_profiles.sql",
  "./seeds/0002_demo_project_catalog.sql",
  "./seeds/0003_demo_planning.sql",
  "./seeds/0004_auth_org_b_and_no_membership.sql",
]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"

[storage]
enabled = true
